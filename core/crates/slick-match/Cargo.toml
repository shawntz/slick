[package]
name = "slick-match"
description = "Launcher fuzzy matcher: tiered scoring over a flat structure-of-arrays arena with a bitmask prefilter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["parallel"]
# search_par: splits the arena over a rayon pool (file search).
parallel = ["dep:rayon"]

[dependencies]
unicode-normalization = "0.1.26"
rayon = { version = "1.12.0", optional = true }
