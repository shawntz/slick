[package]
name = "slick-engine"
description = "Catalog, ranking contract, sessions, suggestions and generic indexes for root search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
slick-match = { path = "../slick-match", default-features = false }
