language = "C"
include_guard = "SLICK_CORE_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen from core/crates/slick-ffi/src. Do not edit; run `make core`. */"
include_version = false
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true
cpp_compat = true
style = "type"
usize_is_size_t = true
documentation = true
documentation_style = "c99"

[export]
prefix = ""
# Exported even though no function returns it by name: every status is an int32_t of these values.
include = ["SlickStatus"]
# Functions Rust imports from the system, such as libdispatch in src/files.rs. Declaring them again
# in the header would clash with the system headers Swift also imports.
exclude = ["dispatch_apply_f"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[const]
allow_static_const = true
