[package]
name = "slick-files"
description = "File index: tree walker, memory-mapped store and path-aware search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["parallel"]
# `Rayon`: a `ParallelFor` over rayon's global pool, for Rust callers and the benchmark.
parallel = ["dep:rayon"]

[dependencies]
slick-match = { path = "../slick-match", default-features = false }
libc = "0.2.191"
rayon = { version = "1.12.0", optional = true }

[dev-dependencies]
fastrand = "2.5.0"
rayon = "1.12.0"

# Walker, search, update, open and memory numbers on synthetic trees. Run with
# `cargo bench -p slick-files --bench files`.
[[bench]]
name = "files"
harness = false
required-features = ["parallel"]
