<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Social card source</title>
<!--
  Source for assets/og.png, the 1200 by 630 picture that link previews show. Render it with
  scripts/site-snapshot.swift at 1200 by 630, scale 1. docs/WEBSITE.md has the command.
  The project's rule: text set in this card uses Avenir Next, with Helvetica Neue as the
  fallback, and never the system font. The picture on the right is the poster frame of the hero
  clip, a recording of the assembled app, cropped from media/hero-dark-poster.png. Render the card
  again when that poster changes.
-->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(48% 70% at 12% 18%, rgb(135 67 250 / 0.55), transparent 70%),
      radial-gradient(42% 62% at 92% 92%, rgb(165 34 252 / 0.4), transparent 72%),
      radial-gradient(40% 50% at 70% 8%, rgb(158 159 244 / 0.18), transparent 70%),
      #0b0520;
    color: #f3ecfe;
    font-family: "Avenir Next", "Helvetica Neue";
    -webkit-font-smoothing: antialiased;
  }
  .rim {
    position: absolute; left: 40px; right: 40px; top: 40px; bottom: 40px; border-radius: 40px;
    border: 1px solid rgb(233 216 251 / 0.14);
    background: linear-gradient(180deg, rgb(255 255 255 / 0.05), rgb(255 255 255 / 0.015));
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.1);
  }
  .text { position: absolute; left: 96px; top: 0; bottom: 0; width: 440px; display: flex; flex-direction: column; justify-content: center; }
  .icon { width: 104px; height: 104px; filter: drop-shadow(0 22px 36px rgb(60 10 170 / 0.6)); }
  .name { margin: 22px 0 0; font-size: 128px; font-weight: 700; line-height: 0.9; letter-spacing: -0.035em; }
  .line { margin: 22px 0 0; font-size: 40px; font-weight: 500; line-height: 1.15; letter-spacing: -0.01em; color: #e9d8fb; }
  .meta { margin: 26px 0 0; display: flex; gap: 16px; align-items: center; font-size: 24px; font-weight: 500; color: #b9a8e6; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #966df8; }
  /* The panel in hero-dark-poster.png spans x 178 to 1700 and y 247 to 1208. It is shown at half
     size, from x 560, and runs off the card's right edge. */
  .shot {
    position: absolute; left: 560px; top: 75px; width: 761px; height: 481px; overflow: hidden; border-radius: 26px;
    box-shadow: 0 40px 90px -30px rgb(3 0 18 / 0.9), 0 0 0 1px rgb(233 216 251 / 0.16);
  }
  .shot img { position: absolute; left: -89px; top: -123.5px; width: 940px; height: 740px; }
</style>
</head>
<body>
  <div class="rim"></div>
  <div class="shot"><img src="../media/hero-dark-poster.png" width="1880" height="1480" alt=""></div>
  <div class="text">
    <img class="icon" src="icon/icon-512.png" width="104" height="104" alt="">
    <p class="name">Slick</p>
    <p class="line">A native macOS launcher</p>
    <p class="meta"><span>Open source</span><span class="dot"></span><span>slick.computer</span></p>
  </div>
</body>
</html>
