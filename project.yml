# XcodeGen spec for the optional Xcode project: make xcode. SwiftPM and the Makefile are the primary
# build. The Xcode project exists for previews, the debugger, Instruments and archiving. It is
# generated and git ignores it; all code lives in Packages/.
#
# ${BRAND_*} values come from support/brand.env, which make xcode exports before running XcodeGen.
# make xcode also writes build/Info.plist from support/Info.plist.in.
name: ${BRAND_NAME}
options:
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: support/Base.xcconfig
  Release: support/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
packages:
  Kit:
    path: Packages/Kit
  LauncherUI:
    path: Packages/LauncherUI
  Platform:
    path: Packages/Platform
  Host:
    path: Packages/Host
  Root:
    path: Packages/Root
  SettingsUI:
    path: Packages/SettingsUI
  CoreBridge:
    path: Packages/CoreBridge
  App:
    path: Packages/App
targets:
  ${BRAND_NAME}:
    type: application
    platform: macOS
    sources:
      - path: Packages/App/Sources/Slick/main.swift
      - path: support/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: App
        product: SlickApp
    preBuildScripts:
      - name: Build the Rust core
        script: |
          cd "$SRCROOT" && scripts/build-rust.sh release
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: ${BRAND_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: ${BRAND_BUNDLE_ID}
        INFOPLIST_FILE: build/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: support/release.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  ${BRAND_NAME}:
    build:
      targets:
        ${BRAND_NAME}: all
    run:
      config: Debug
      commandLineArguments:
        "--selftest": true
    profile:
      config: Release
    archive:
      config: Release
