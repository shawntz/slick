# Lint, test, build and selftest on every push to main and every pull request.
#
# Runner facts (GitHub runner images, November 2026): xcode-27 is macOS 27 on Apple silicon with
# Xcode 27.0, 27.1 (default) and 27.2. macos-26 and macos-latest carry only Xcode 26, which lacks the
# macOS 27 SDK this code needs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI builds third-party code, so its token may only read the repository. Whoever can write releases
# controls the update feed, which is the latest release's appcast.xml.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: xcode-27
    # The release dry run builds the Rust core and the app again from nothing.
    timeout-minutes: 45
    env:
      # Zero warnings in Swift: CI turns them into errors.
      SWIFT_FLAGS: -Xswiftc -warnings-as-errors
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode from .xcode-version
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock') }}-${{ hashFiles('core/**/*.rs') }}
          restore-keys: cargo-${{ hashFiles('rust-toolchain.toml', 'core/Cargo.lock') }}-

      - name: Cache SwiftPM build directories
        uses: actions/cache@v6
        with:
          path: |
            Packages/*/.build
            Packages/Features/*/.build
          key: spm-${{ hashFiles('.xcode-version', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-${{ hashFiles('.xcode-version', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}-

      - name: Bootstrap
        run: make bootstrap

      - name: Lint
        run: make lint

      # Two at a time: the runner has three cores, and four suites at once starve each other.
      # Keep going after a failure, so one run shows every package that fails.
      - name: Test
        run: make -k -j2 test

      # The release pipeline from a clean build, signed ad hoc and without the notary service, into
      # a temporary folder, then every artifact checked: the bundle, its notices, the zips, the dSYM,
      # the update feed signed with a throwaway key, the cask, and the shipped executable started
      # with --version. It needs no secret and publishes nothing.
      - name: Release dry run
        run: make release-dry-run

      - name: The generated C header is committed and current
        run: git diff --exit-code -- core/crates/slick-ffi/include Packages/CoreBridge/Sources/SlickCoreC/include

      - name: Build, bundle (ad hoc) and selftest
        run: make selftest SIGN_IDENTITY=-

      # dyld loads Sparkle.framework before main runs, so a bundle whose framework is missing or
      # wrongly signed fails here. --version prints and exits before the app makes any window.
      - name: The bundle starts and loads its frameworks
        run: |
          . support/brand.env
          "build/$BRAND_NAME.app/Contents/MacOS/$BRAND_NAME" --version

      - uses: actions/upload-artifact@v7
        with:
          name: app-bundle
          path: build/*.app
